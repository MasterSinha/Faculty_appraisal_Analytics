services:
  faculty-analytics:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: "/Analytics/"
    env_file:
      - .env
    environment:
      PORT: 8080
      WORKERS: 2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "8080:8080"
